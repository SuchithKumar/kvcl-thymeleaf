<!doctype html>
<html 
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:replace="~{fragments/layoutFragmentsPrivate :: headFragOld}">

</head>

<body class="d-flex flex-column vh-100">

<div th:insert="~{fragments/layoutFragmentsPrivate  :: navFrag}" ></div>
<!--<div th:insert="~{fragments/layoutFragmentsPrivate  :: sidebarFrag}" ></div>-->

<div class="vh-100 overflow-auto">
	<div class="container-lg text-center">
<!--		<form action="/squads/show-squad" method="get">-->
<!--			<div data-mdb-input-init class="form-outline form-white mb-4">-->
<!--				<label class="form-label fs-4">Select Team from dropdown</label>-->
<!--				<select name="selectedTeamName" id="selectedTeamName"  class="form-control form-control-lg" required="required">-->
<!--					<option th:each="p : ${teamNames}" th:value="${p}" th:text="${p}"></option>-->
<!--				</select>-->
<!--			</div>-->
<!--			<button class="btn btn-primary">Show Squad</button>-->
<!--		</form>-->

		<div>
			<table class="table table-responsive table-hover">
				<thead>
				<th>Team Name</th>
				<th>Open</th>
				</thead>
				<tbody>
				<tr th:each="teamName : ${teamNames}">
					<td style="font-size:20px" th:text="${teamName}"></td>
					<td><a class="btn btn-primary" style="padding:5px 5px;font-size:22px" th:href="@{/squads/show-squad(selectedTeamName=${teamName})}">Show Squad</a></td>
				</tr>
				</tbody>
			</table>
		</div>

	</div>
	<div th:if="${squads!=null}">
		<div th:each="squad : ${squads}">
				<div class="container-lg text-center" style="margin-bottom: 10px">
					<span class="titles" th:text="${squad.team.sponsorName}"></span>
					<span class="titles" th:text="${squad.team.name}"></span>
					<br>
					<img th:src="@{images/icons/collab.png}" style="width:80px;height:80px">
					<h3 th:text="${count}"></h3>
				</div>
				<div class="container-lg text-center" style="margin-bottom: 30px">
				<img th:src="${sponsor}" alt="Avatar"  style="width: 300px;height: 300px">
				<img th:src="${squad.team.logoImg}" alt="Avatar" style="width: 300px; height:300px" />
					<div class="container-lg text-center">
						<div class="row">
							<div class="pro-container-captain" >
								<div class="pro-card">
									<div class="pro-side">

										<img th:src="${squad.teamCaptain.photoImg}"  style="width: 260px; height: 400px;border-radius:10px;border:15px solid #0e2238;border-bottom:55px solid #0e2238;border-top:60px solid #0e2238">
										<img th:if="${squad.teamCaptain.playerSkill == 'Batsmen' or squad.teamCaptain.playerSkill == 'Allrounder'}" th:src="@{images/icons/batsmen-2.png}"  style="width: 60px; height: 60px; position:absolute; bottom:-52px;left:0px">
										<img th:src="@{images/icons/captain.png}" style="width:60px;height:60px;position:absolute;float:top;bottom:290px;left:97px" >

										<img th:src="@{images/icons/collab.png}" style="width:35px;height:35px;position:absolute;bottom:-26px;left:106px" >
										<h6 th:text="${squad.teamCaptain.likes}" style="position:absolute;bottom:-55px;left:118px;font-size:16px;color:white"></h6>


										<img th:if="${squad.teamCaptain.playerSkill == 'Bowler' or squad.teamCaptain.playerSkill == 'Allrounder'}" th:src="@{images/icons/bowler.png}"  style="width: 50px; height: 50px; position:absolute; float:top; bottom:-45px; left:200px">

										<h3 class="text-center" style="font-family:'Times New Roman';serif; position:relative;  bottom:10px" th:text="${squad.teamCaptain.playerName}"></h3>
										<h5 class="text-center" style="font-family:'Times New Roman';serif; position:relative;  bottom:20px" th:text="${squad.teamCaptain.profession}"></h5>


									</div>
									<div class="pro-side pro-back text-center">
										<div th:if="${user.isViewer==false}">
											<h5><strong>Handshake</strong></h5>
											<div class="text-center">
												<!--											<h6 th:text="${squad.teamCaptain.likes}"></h6>-->
												<a th:href="@{/user/collab(playerId=${squad.teamCaptain.playerId},selectedTeamName=${squad.team.name})}"><img th:src="@{/images/icons/collab.png}" style="width:60px;height:60px"></a>
											</div>
										</div>
										<h5><strong>Age</strong></h5>
										<h6 th:text="${squad.teamCaptain.age}"></h6>
										<h5><strong>Jersey Size</strong></h5>
										<h6 th:text="${squad.teamCaptain.playerShirtSize}"></h6>
										<h5><strong>Batting Style</strong></h5>
										<h6  th:text="${squad.teamCaptain.battingStyle}"></h6>
										<h5><strong>Bowling Style</strong></h5>
										<h6 th:text="${squad.teamCaptain.bowlingStyle}"></h6>
										<h5><strong>Gothram</strong></h5>
										<h6 th:text="${squad.teamCaptain.playerGothram}"></h6>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			<br>
			<br>
			<br>
			<div class="container-lg">
				<div class="row">
					<div th:each="item,stats : ${squad.approvedPlayers}" class="col-md-3" style="margin-left: 35px;margin-bottom: 50px;margin-right: 35px">
						<div class="pro-container" >
							<div class="pro-card">
								<div class="pro-side">
									<img th:src="${item.photoImg}"  style="width: 260px; height: 350px;border-radius:10px;border:15px solid #0e2238;border-bottom:55px solid #0e2238">
									<img th:if="${item.playerSkill == 'Batsmen' or item.playerSkill == 'Allrounder'}" th:src="@{images/icons/batsmen-2.png}"  style="width: 60px; height: 60px; position:absolute; bottom:-1px;left:0px">
									<img th:src="@{images/icons/collab.png}" style="width:35px;height:35px;position:absolute;bottom:21px;left:106px" >
									<h6 th:text="${item.likes}" style="position:absolute;bottom:-6px;left:118px;font-size:16px;color:white"></h6>

									<img th:if="${item.playerSkill == 'Bowler' or item.playerSkill == 'Allrounder'}" th:src="@{images/icons/bowler.png}"  style="width: 50px; height: 50px; position:absolute; bottom:2px; right:0px">

									<h3 class="text-center" style="font-family:'Times New Roman';serif; position:relative;  bottom:10px" th:text="${item.playerName}"></h3>
									<h5 class="text-center" style="font-family:'Times New Roman';serif; position:relative;  bottom:20px" th:text="${item.profession}"></h5>
								</div>
								<div class="pro-side pro-back text-center">
									<div th:if="${user.isViewer==false}">
										<h5><strong>Handshake</strong></h5>
										<div class="text-center">
											<!--											<h6 th:text="${squad.teamCaptain.likes}"></h6>-->
											<a th:href="@{/user/collab(playerId=${item.playerId},selectedTeamName=${squad.team.name})}"><img th:src="@{/images/icons/collab.png}" style="width:60px;height:60px"></a>
										</div>
									</div>
									<h5><strong>Age</strong></h5>
									<h6 th:text="${item.age}"></h6>
									<h5><strong>Jersey Size</strong></h5>
									<h6 th:text="${item.playerShirtSize}"></h6>
									<h5><strong>Batting Style</strong></h5>
									<h6  th:text="${item.battingStyle}"></h6>
									<h5><strong>Bowling Style</strong></h5>
									<h6 th:text="${item.bowlingStyle}"></h6>
									<h5><strong>Gothram</strong></h5>
									<h6 th:text="${item.playerGothram}"></h6>
								</div>
								</div>
							</div>
						</div>
					</div>
					</div>
				</div>
			<br>
			<br>
			</div>

		</div>
</div>
<br>
<br>
<div th:replace="~{fragments/layoutFragmentsPrivate :: footFrag}"></div>

<script th:inline="javascript">
  toastr.options = {
  "closeButton": false,
  "debug": false,
  "newestOnTop": false,
  "progressBar": false,
  "positionClass": "toast-top-full-width",
  "preventDuplicates": false,
  "onclick": null,
  "showDuration": "300",
  "hideDuration": "1000",
  "timeOut": "5000",
  "extendedTimeOut": "1000",
  "showEasing": "swing",
  "hideEasing": "linear",
  "showMethod": "fadeIn",
  "hideMethod": "fadeOut"
}

var str = [[${msg}]];
if(str!=null){
	console.log('str : '+str);
	if(str.includes('success')){
		toastr.success('success','Collab Save Request!',{timeOut:3000});
	}else if(str.includes('warning')){
		toastr.warning('already saved!','nothing to save!',{timeOut:3000});
	}else{
		toastr.error('Illegal request!','Cant save this request!',{timeOut:3000});
	}
}
</script>

</body>
</html>
